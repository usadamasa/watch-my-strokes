name: Setup Bun
description: Install a pinned Bun version and workspace dependencies

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "1.3.11"

runs:
  using: composite
  steps:
    - name: Install Bun
      shell: bash
      run: |
        curl -fsSL https://bun.sh/install | bash -s "bun-v${{ inputs.bun-version }}"
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
