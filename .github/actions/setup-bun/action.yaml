name: Setup Bun
description: Load the flake.nix devShell (Bun) and install workspace dependencies

runs:
  using: composite
  steps:
    # Nix の導入と devShell の読み込みは gh-manage の共有 action に任せる。
    # Bun の版は flake.lock の nixpkgs が決める
    - name: Setup Nix devShell
      uses: usadamasa/gh-manage/actions/setup-nix@main

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
